expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 96M
upload_max_filesize = 100M
post_max_size = 104M
max_execution_time = 90
max_input_time = 120
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 32
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
