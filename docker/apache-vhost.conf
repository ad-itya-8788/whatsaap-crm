ServerName localhost

<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    ServerLimit 16
    MaxRequestWorkers 16
    MaxConnectionsPerChild 1000
</IfModule>

ServerTokens Prod
ServerSignature Off
KeepAliveTimeout 2

<VirtualHost *:${RENDER_HTTP_PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /storage/ /var/www/html/storage/app/public/
    <Directory /var/www/html/storage/app/public>
        Options -Indexes -ExecCGI -FollowSymLinks
        AllowOverride None
        Require all granted
        <FilesMatch "(?i)(^\.|\.(php[0-9]*|phtml|phar)(\.|$))">
            Require all denied
        </FilesMatch>
    </Directory>

    <IfModule mod_proxy.c>
        ProxyPreserveHost On
        ProxyPass /apps/ http://127.0.0.1:8080/apps/
        ProxyPassReverse /apps/ http://127.0.0.1:8080/apps/
        ProxyPass /app/ ws://127.0.0.1:8080/app/
        ProxyPassReverse /app/ http://127.0.0.1:8080/app/
    </IfModule>

    <Location /build/assets/>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
